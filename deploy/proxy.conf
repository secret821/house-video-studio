# Candidate proxy: install in a private preview server first. Public root activation requires a backed-up switch.
location ^~ / {
    client_max_body_size 1030m;
    client_body_timeout 900s;
    proxy_pass http://127.0.0.1:4340;
    # Pin the public Host: external requests must never enter the renderer-only loopback media exception.
    proxy_set_header Host 121.41.6.73;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Origin is deliberately preserved for the application's exact allow-list.
    proxy_set_header Authorization "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;
}
